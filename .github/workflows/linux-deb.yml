name: Deepin Debian package

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux-deb:
    name: Deepin package (amd64)
    # Debian 12 provides glibc 2.36 and the WebKitGTK 4.1 development stack
    # required by Tauri, making the resulting binary compatible with Deepin.
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install Linux build dependencies
        run: |
          apt-get update
          apt-get install -y \
            binutils \
            build-essential \
            ca-certificates \
            curl \
            dpkg-dev \
            git \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            python3 \
            xz-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Check frontend
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Test frontend
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Test Rust workspace (non-blocking)
        continue-on-error: true
        run: cargo test --workspace

      - name: Verify Linux app detection and process filtering
        run: |
          cargo test -p codex-plus-core --test launcher app_paths_ -- --test-threads=1
          cargo test -p codex-plus-core --test watcher linux_codex_process_scan
          cargo test -p codex-plus-core --test linux_package --test installers

      - name: Build release binaries
        run: cargo build --release -p codex-plus-manager --bin codex-plus-plus

      - name: Build Deepin package
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)+deepin.${GITHUB_RUN_NUMBER}"
          fi
          bash scripts/installer/linux/package-deb.sh "$VERSION" amd64

      - name: Verify runtime libraries
        shell: bash
        run: |
          ldd target/release/codex-plus-plus | tee /tmp/codex-plus-plus-ldd.txt
          if grep -q 'not found' /tmp/codex-plus-plus-ldd.txt; then
            exit 1
          fi

      - name: Upload Deepin package artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-plus-plus-deepin-amd64-deb
          path: dist/linux/*.deb
          if-no-files-found: error

      - name: Upload Deepin package to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/linux/*.deb
